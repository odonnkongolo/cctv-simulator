name: Python Code Linting

# 1. Trigger the pipeline on any push to the main branch
on:
  push:
    branches: [ main ]

jobs:
  test-and-lint:
    # 2. Spin up a clean, hosted Ubuntu server in the cloud
    runs-on: ubuntu-latest

    steps:
    # 3. Pull your code from your repository onto that new server
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    # 4. Set up Python on that server
    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 5. Install flake8 (a standard tool to check for Python syntax errors)
    - name: Install Linting Tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8

    # 6. Run the check against your python scripts
    - name: Check Python Syntax for Errors
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  build-and-push:
    needs: test-and-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Lowercase Repository Name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}
        
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.REPO }}:latest